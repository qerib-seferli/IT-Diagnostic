name: Windows Portable EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/windows-exe.yml'

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows-10-11-x64
            python: '3.11'
            arch: x64
            pyinstaller: '6.16.0'
          - label: Windows-10-11-x86
            python: '3.11'
            arch: x86
            pyinstaller: '6.16.0'
          - label: Windows-7-8.1-x64
            python: '3.8.10'
            arch: x64
            pyinstaller: '5.13.2'
          - label: Windows-7-8.1-x86
            python: '3.8.10'
            arch: x86
            pyinstaller: '5.13.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - name: Install packager
        run: python -m pip install --upgrade pip "pyinstaller==${{ matrix.pyinstaller }}"
      - name: Check Windows 7 runtime dependencies
        if: contains(matrix.label, 'Windows-7-8.1')
        shell: pwsh
        run: |
          python -c "import sys, tkinter, _tkinter, ssl; print(sys.version); print('Tcl:', tkinter.TclVersion, 'Tk:', tkinter.TkVersion); print('OpenSSL:', ssl.OPENSSL_VERSION)"
      # Windows 7 requires the legacy Python 3.8 runtime.  Check the actual
      # Tcl/Tk and Visual C++ runtime files before building the legacy EXE.
      - name: Verify legacy Windows runtime files
        if: contains(matrix.label, 'Windows-7-8.1')
        shell: pwsh
        run: |
          @'
          import pathlib, sys, _tkinter
          root = pathlib.Path(sys.base_prefix)
          dlls = root / 'DLLs'
          required = [dlls / '_tkinter.pyd', root / 'DLLs' / 'tcl86t.dll', root / 'DLLs' / 'tk86t.dll']
          for p in required:
              print(('FOUND: ' if p.exists() else 'MISSING: ') + str(p))
          if not (dlls / '_tkinter.pyd').exists():
              raise SystemExit('Tkinter extension is missing')
          print('Python:', sys.version, 'Tk:', _tkinter.TK_VERSION)
          '@ | python -
      - name: Build portable one-file executable
        shell: pwsh
        run: |
          $args = @('--noconfirm','--clean','--noupx','--onefile','--windowed',
            '--hidden-import','encodings.idna','--hidden-import','_tkinter',
            '--collect-submodules','encodings','--icon','app/app.ico',
            '--name','IT-Diagnostic','--add-data','app/config.json;.',
            '--add-data','app/logo.png;.','--add-data','app/app.ico;.',
            '--add-data','app/organizations.csv;.')
          if ('${{ matrix.label }}' -like 'Windows-7-8.1*') {
            # Explicitly collect the legacy Tcl/Tk binaries. PyInstaller also
            # collects Tcl/Tk scripts using its tkinter runtime hook.
            $pyRoot = (python -c 'import sys; print(sys.base_prefix)').Trim()
            foreach ($dll in @('tcl86t.dll','tk86t.dll')) {
              $found = @("$pyRoot\DLLs\$dll", "$pyRoot\$dll") | Where-Object { Test-Path $_ } | Select-Object -First 1
              if ($found) { $args += @('--add-binary',"${found};.") }
              else { Write-Warning "Legacy runtime DLL not found: $dll" }
            }
          }
          $args += 'app/main.py'
          python -m PyInstaller @args
      - name: Verify executable and generate SHA-256 report
        shell: pwsh
        run: |
          $exe = 'dist/IT-Diagnostic.exe'
          if (-not (Test-Path $exe)) { throw 'Build EXE not found' }
          $item = Get-Item $exe
          if ($item.Length -lt 100000) { throw 'Build EXE is unexpectedly small' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $signature = Get-AuthenticodeSignature $exe
          @(
            "Variant: ${{ matrix.label }}"
            "Python: ${{ matrix.python }}"
            "Architecture: ${{ matrix.arch }}"
            "PyInstaller: ${{ matrix.pyinstaller }}"
            "File: IT-Diagnostic.exe"
            "Bytes: $($item.Length)"
            "SHA256: $hash"
            "Authenticode status: $($signature.Status)"
            'Note: SHA256 is for integrity only. It does not certify malware safety.'
            'Note: An unsigned EXE can still trigger browser/antivirus alerts.'
          ) | Set-Content -Path 'dist/build-verification.txt' -Encoding UTF8
          Get-Content 'dist/build-verification.txt'
      - name: Upload build verification report
        uses: actions/upload-artifact@v4
        with:
          name: IT-Diagnostic-${{ matrix.label }}-verification
          path: dist/build-verification.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: IT-Diagnostic-${{ matrix.label }}
          path: dist/IT-Diagnostic.exe
          if-no-files-found: error
