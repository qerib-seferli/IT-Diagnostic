name: Windows Portable EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/windows-exe.yml'

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows-10-11-x64
            python: '3.11'
            arch: x64
            pyinstaller: '6.16.0'
          - label: Windows-10-11-x86
            python: '3.11'
            arch: x86
            pyinstaller: '6.16.0'
          - label: Windows-7-8.1-x64
            python: '3.8'
            arch: x64
            pyinstaller: '5.13.2'
          - label: Windows-7-8.1-x86
            python: '3.8'
            arch: x86
            pyinstaller: '5.13.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - name: Install packager
        run: python -m pip install --upgrade pip "pyinstaller==${{ matrix.pyinstaller }}"
      - name: Build portable one-file executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --noupx --onefile --windowed --hidden-import encodings.idna --collect-submodules encodings --icon app/app.ico --name IT-Diagnostic --add-data "app/config.json;." --add-data "app/logo.png;." --add-data "app/app.ico;." --add-data "app/organizations.csv;." app/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: IT-Diagnostic-${{ matrix.label }}
          path: dist/IT-Diagnostic.exe
          if-no-files-found: error
