name: Windows Portable EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/windows-exe.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: python -m pip install --upgrade pip && pip install pyinstaller==5.13.2
      - run: pyinstaller --noconfirm --onefile --windowed --name IT-Diagnostic --add-data "app/config.json;." --add-data "app/logo.png;." --add-data "app/organizations.csv;." app/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: IT-Diagnostic-Windows-Portable
          path: dist/IT-Diagnostic.exe
